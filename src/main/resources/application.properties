# Server
server.port=8080

# MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/restoran_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=mayilzadeh
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Open Session in View (LazyInitializationException-un qarşısını alır)
spring.jpa.open-in-view=true

# Thymeleaf
spring.thymeleaf.cache=false

# Şəkil yükləmə (default limit 1MB-dır)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB