<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sifarişlərim</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --primary-black: #0f172a;
            --accent-color: #0284c7;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 40px 20px; }

        .container { max-width: 850px; margin: 0 auto; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
        }

        .header h1 { font-size: 1.8rem; font-weight: 700; display: flex; align-items: center; gap: 12px; }
        .header h1 i { color: var(--accent-color); }

        .btn-back {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 8px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            transition: all 0.2s ease-in-out;
        }
        .btn-back:hover { background-color: var(--accent-color); color: #ffffff; border-color: var(--accent-color); }

        .empty-state {
            text-align: center;
            padding: 50px 20px;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
        }
        .empty-state i { font-size: 3rem; color: var(--accent-color); margin-bottom: 15px; }
        .empty-state h2 { font-size: 1.4rem; color: var(--text-main); font-weight: 600; }

        /* Sifariş kartı */
        .order-card {
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            margin-bottom: 20px;
            overflow: hidden;
        }

        .order-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 16px 22px;
            background: #f1f5f9;
            border-bottom: 1px solid var(--border-color);
        }

        .order-title { font-size: 1.05rem; font-weight: 700; }

        .order-meta { display: flex; align-items: center; gap: 12px; }
        .order-date { color: var(--text-muted); font-size: 0.88rem; }

        .status {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 700;
        }
        .status-pending  { background: #fef3c7; color: #92400e; }
        .status-progress { background: #e0f2fe; color: #075985; }
        .status-ready    { background: #dcfce7; color: #166534; }

        .order-body { padding: 8px 22px 6px; }

        .order-item {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
        }
        .order-item:last-child { border-bottom: none; }
        .item-name { font-weight: 600; }
        .item-qty { color: var(--text-muted); margin-left: 6px; font-weight: 500; }
        .item-price { font-weight: 600; color: var(--accent-color); white-space: nowrap; }

        .order-total {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 22px;
            border-top: 1px solid var(--border-color);
            font-weight: 600;
        }
        .order-total .amount { color: var(--accent-color); font-size: 1.2rem; font-weight: 700; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1><i class="fa-solid fa-receipt"></i> Sifarişlərim</h1>
        <a th:href="@{/menu}" class="btn-back">
            <i class="fa-solid fa-arrow-left"></i> Menyuya qayıt
        </a>
    </div>

    <!-- Sifariş yoxdursa -->
    <div th:if="${#lists.isEmpty(orders)}" class="empty-state">
        <i class="fa-solid fa-bag-shopping"></i>
        <h2>Hələ sifarişiniz yoxdur</h2>
        <p style="margin-top: 8px;">Menyudan məhsul seçib ilk sifarişinizi verə bilərsiniz.</p>
    </div>

    <!-- Sifarişlər -->
    <div class="order-card" th:each="o : ${orders}">
        <div class="order-head">
            <span class="order-title">Sifariş #<span th:text="${o.id}">1</span></span>
            <div class="order-meta">
                <span class="order-date" th:text="${#temporals.format(o.createdAt, 'dd.MM.yyyy HH:mm')}">01.01.2026 12:00</span>
                <span class="status"
                      th:classappend="${o.status.name() == 'PENDING'} ? 'status-pending' : (${o.status.name() == 'IN_PROGRESS'} ? 'status-progress' : 'status-ready')"
                      th:text="${o.status.name() == 'PENDING'} ? 'Gözləyir' : (${o.status.name() == 'IN_PROGRESS'} ? 'Hazırlanır' : 'Hazırdır')">Status</span>
            </div>
        </div>

        <div class="order-body">
            <div class="order-item" th:each="it : ${o.items}">
                <span>
                    <span class="item-name" th:text="${it.product.name}">Məhsul</span>
                    <span class="item-qty" th:text="'× ' + ${it.quantity}">× 1</span>
                </span>
                <span class="item-price" th:text="${it.price * it.quantity} + ' ₼'">0 ₼</span>
            </div>
        </div>

        <div class="order-total">
            <span>Ümumi məbləğ:</span>
            <span class="amount" th:text="${o.total} + ' ₼'">0 ₼</span>
        </div>
    </div>
</div>

</body>
</html>
