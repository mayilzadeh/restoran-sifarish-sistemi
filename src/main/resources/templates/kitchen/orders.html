<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="30">
    <title>Mətbəx</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <span class="navbar-brand">👨‍🍳 Mətbəx Paneli</span>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <button class="btn btn-outline-light btn-sm">Çıxış</button>
        </form>
    </div>
</nav>

<div class="container mt-4">
    <h1 class="mb-4">Aktiv sifarişlər</h1>

    <div th:if="${#lists.isEmpty(orders)}" class="alert alert-info">
        Hazırda aktiv sifariş yoxdur.
    </div>

    <div class="row">
        <div class="col-md-6 mb-4" th:each="o : ${orders}">
            <div class="card shadow-sm">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <strong>Sifariş #<span th:text="${o.id}">1</span></strong>
                    <span class="badge"
                          th:classappend="${o.status.name() == 'PENDING'} ? 'bg-warning text-dark' : 'bg-primary'"
                          th:text="${o.status.name() == 'PENDING'} ? 'Gözləyir' : 'Hazırlanır'">Status</span>
                </div>

                <div class="card-body">
                    <p class="text-muted small mb-2"
                       th:text="${#temporals.format(o.createdAt, 'dd.MM.yyyy HH:mm')} + ' · ' + ${o.user.username}">
                        Tarix · istifadəçi
                    </p>

                    <ul class="list-group list-group-flush mb-3">
                        <li class="list-group-item d-flex justify-content-between px-0" th:each="i : ${o.items}">
                            <span th:text="${i.product.name}">Məhsul</span>
                            <strong th:text="'× ' + ${i.quantity}">× 1</strong>
                        </li>
                    </ul>

                    <form th:if="${o.status.name() == 'PENDING'}"
                          th:action="@{/kitchen/{id}/status(id=${o.id})}" method="post">
                        <input type="hidden" name="status" value="IN_PROGRESS">
                        <button type="submit" class="btn btn-warning w-100">Hazırlanır</button>
                    </form>

                    <form th:if="${o.status.name() == 'IN_PROGRESS'}"
                          th:action="@{/kitchen/{id}/status(id=${o.id})}" method="post">
                        <input type="hidden" name="status" value="READY">
                        <button type="submit" class="btn btn-success w-100">Hazır</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
