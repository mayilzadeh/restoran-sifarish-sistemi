<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş | Restoran İdarəetmə Sistemi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #e0f2fe 0%, #f1f5f9 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 420px;
            padding: 40px 36px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-icon {
            width: 56px;
            height: 56px;
            background-color: #e0f2fe;
            color: var(--primary);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            margin: 0 auto 16px;
        }

        .brand-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        .brand-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 6px;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 500;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert-success {
            background-color: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
        }

        .alert-danger {
            background-color: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            color: #94a3b8;
            font-size: 1rem;
            transition: color 0.2s;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px 12px 42px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.95rem;
            color: var(--text-main);
            outline: none;
            background-color: #f8fafc;
            transition: all 0.2s ease-in-out;
        }

        .form-control:focus {
            background-color: #ffffff;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.1);
        }

        .form-control:focus + i {
            color: var(--primary);
        }

        .btn-submit {
            width: 100%;
            padding: 13px;
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            margin-top: 10px;
            box-shadow: 0 4px 6px -1px rgba(2, 132, 199, 0.2);
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 12px -2px rgba(2, 132, 199, 0.3);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .demo-credentials {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px dashed var(--border-color);
            text-align: center;
        }

        .demo-credentials p {
            font-size: 0.82rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .badge-list {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .badge {
            background-color: #f1f5f9;
            color: #475569;
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 6px;
            font-family: monospace;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

<div class="login-card">
    <div class="brand-header">
        <div class="brand-icon">
            <i class="fa-solid fa-utensils"></i>
        </div>
        <h1>Central Baku</h1>
        <p>Davam etmək üçün hesabınıza daxil olun</p>
    </div>

    <!-- Uğurlu Çıxış Mesajı -->
    <div th:if="${param.logout}" class="alert alert-success">
        <i class="fa-solid fa-circle-check"></i>
        <span>Uğurla çıxış etdiniz</span>
    </div>

    <!-- Xəta Mesajı -->
    <div th:if="${param.error}" class="alert alert-danger">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span>İstifadəçi adı və ya şifrə yanlışdır!</span>
    </div>

    <form th:action="@{/login}" method="post">
        <input type="hidden" th:if="${_csrf}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <div class="form-group">
            <label for="username">İstifadəçi adı</label>
            <div class="input-wrapper">
                <input type="text" id="username" name="username" class="form-control" placeholder="İstifadəçi adınızı daxil edin" required autofocus>
                <i class="fa-solid fa-user"></i>
            </div>
        </div>

        <div class="form-group">
            <label for="password">Şifrə</label>
            <div class="input-wrapper">
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                <i class="fa-solid fa-lock"></i>
            </div>
        </div>

        <button type="submit" class="btn-submit">
            Daxil ol <i class="fa-solid fa-arrow-right-to-bracket" style="margin-left: 6px; font-size: 0.9rem;"></i>
        </button>
    </form>

    <div class="demo-credentials">
        <p>Test Hesabları:</p>
        <div class="badge-list">
            <span class="badge">admin / admin123</span>
            <span class="badge">user / user123</span>
            <span class="badge">kitchen / kitchen123</span>
        </div>
    </div>
</div>

</body>
</html>
