<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sifariş qəbul edildi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body>
<div class="container text-center" style="margin-top: 80px; max-width: 640px;">

    <div style="font-size: 4rem;">✅</div>
    <h1 class="text-success fw-bold mb-4">Sifarişiniz qəbul edildi!</h1>

    <p class="fs-4 mb-2">
        Sifariş nömrəsi: <strong th:text="'#' + ${order.id}">#1</strong>
    </p>

    <p class="fs-5 mb-4">
        Ümumi məbləğ: <strong th:text="${order.total} + ' ₼'">0 ₼</strong>
    </p>

    <p class="text-muted mb-4">Mətbəx sifarişinizi hazırlamağa başlayır.</p>

    <a th:href="@{/menu}" class="btn btn-primary btn-lg me-2">Menyuya qayıt</a>
    <a th:href="@{/order/my-orders}" class="btn btn-outline-secondary btn-lg">Sifarişlərim</a>
</div>
</body>
</html>
