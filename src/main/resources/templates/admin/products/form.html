<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Məhsul</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: nav('products')}"></div>

<div class="container mt-4" style="max-width: 640px;">
    <h1 th:text="${product.id == null} ? 'Yeni məhsul' : 'Məhsulu redaktə et'">Məhsul</h1>

    <form th:action="${product.id == null} ? @{/admin/products} : @{/admin/products/{id}(id=${product.id})}"
          method="post" enctype="multipart/form-data">

        <div class="mb-3">
            <label class="form-label">Ad</label>
            <input type="text" name="name" class="form-control" th:value="${product.name}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Qiymət (₼)</label>
            <input type="number" name="price" step="0.01" min="0" class="form-control" th:value="${product.price}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Təsvir</label>
            <textarea name="description" rows="3" class="form-control" th:text="${product.description}"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Kateqoriya</label>
            <select name="categoryId" class="form-select" required>
                <option value="">Seçin...</option>
                <option th:each="c : ${categories}"
                        th:value="${c.id}"
                        th:text="${c.name}"
                        th:selected="${product.category != null and product.category.id == c.id}">Kateqoriya</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Şəkil</label>
            <div th:if="${product.imageUrl != null}" class="mb-2">
                <img th:src="${product.imageUrl}" alt="Cari şəkil" style="max-height: 120px; border-radius: 8px;">
            </div>
            <input type="file" name="imageFile" accept="image/*" class="form-control">
        </div>

        <button type="submit" class="btn btn-primary">Yadda saxla</button>
        <a th:href="@{/admin/products}" class="btn btn-secondary">Ləğv et</a>
    </form>
</div>
</body>
</html>
