<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Kateqoriyalar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: nav('categories')}"></div>

<div class="container mt-4">
    <h1>Kateqoriyalar</h1>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="row">
        <div class="col-md-6">
            <form th:action="@{/admin/categories}" th:object="${newCategory}" method="post" class="mb-4">
                <div class="input-group">
                    <input type="text" th:field="*{name}" class="form-control" placeholder="Kateqoriya adı" required>
                    <button class="btn btn-primary">+ Əlavə et</button>
                </div>
            </form>

            <ul class="list-group">
                <li th:each="c : ${categories}" class="list-group-item d-flex justify-content-between">
                    <span th:text="${c.name}"></span>
                    <form th:action="@{'/admin/categories/' + ${c.id} + '/delete'}" method="post">
                        <button class="btn btn-sm btn-danger" onclick="return confirm('Silinsin?')">Sil</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</div>
</body>
</html>
