<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sifarişlər</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
</head>
<body>
<div th:replace="~{fragments/admin-nav :: nav('orders')}"></div>

<div class="container mt-4">
    <h1>Sifarişlər</h1>

    <div class="mb-3">
        <a th:href="@{/admin/orders}" class="btn btn-sm"
           th:classappend="${selectedStatus == null} ? 'btn-primary' : 'btn-outline-primary'">Hamısı</a>
        <a th:each="s : ${statuses}"
           th:href="@{/admin/orders(status=${s})}"
           class="btn btn-sm"
           th:classappend="${selectedStatus == s} ? 'btn-primary' : 'btn-outline-primary'"
           th:text="${s}"></a>
    </div>

    <table class="table table-striped align-middle">
        <thead>
        <tr>
            <th>#</th><th>User</th><th>Status</th><th>Tarix</th><th>Məbləğ</th><th>Məhsullar</th><th>Statusu dəyiş</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="o : ${orders}">
            <td th:text="${o.id}"></td>
            <td th:text="${o.user.username}"></td>
            <td><span class="badge bg-secondary" th:text="${o.status}"></span></td>
            <td th:text="${#temporals.format(o.createdAt, 'dd.MM.yyyy HH:mm')}"></td>
            <td th:text="${o.total} + ' ₼'"></td>
            <td>
                <ul class="mb-0 small">
                    <li th:each="it : ${o.items}">
                        <span th:text="${it.product.name}"></span> ×
                        <span th:text="${it.quantity}"></span>
                    </li>
                </ul>
            </td>
            <td>
                <form th:action="@{/admin/orders/{id}/status(id=${o.id})}" method="post" class="d-flex gap-2">
                    <select name="status" class="form-select form-select-sm">
                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
                                th:selected="${o.status == s}"></option>
                    </select>
                    <button type="submit" class="btn btn-sm btn-primary">Dəyiş</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <div th:if="${#lists.isEmpty(orders)}" class="alert alert-info">Sifariş yoxdur.</div>
</div>
</body>
</html>
